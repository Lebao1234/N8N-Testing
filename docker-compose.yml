# =============================================================================
# n8n local stack — CHỈ DÙNG CHO DEV/TEST TRÊN MÁY LOCAL, KHÔNG DÙNG PRODUCTION
# Services: postgres, n8n, qdrant, ollama (profile: ai-local)
# Mọi port chỉ bind 127.0.0.1 => không lộ ra mạng LAN.
# =============================================================================
name: n8n-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — database chính của n8n (thay cho SQLite)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Qdrant — vector database cho RAG (REST: 6333, gRPC: 6334)
  # Truy cập từ n8n: http://qdrant:6333 | Dashboard: http://localhost:6333/dashboard
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: n8n-qdrant
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      # Image qdrant không có curl/wget => kiểm tra port bằng bash /dev/tcp
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Ollama — LLM local (chỉ chạy khi bật profile ai-local: make up-ai)
  # Truy cập từ n8n: http://ollama:11434 (KHÔNG dùng localhost bên trong container)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.11
    container_name: n8n-ollama
    profiles: ["ai-local"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    # --- GPU NVIDIA: bỏ comment khối dưới (cần Docker Desktop + WSL2 + driver NVIDIA) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # n8n
  # ---------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.4}
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # --- Database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public

      # --- Bảo mật / mã hoá credential (KHÔNG đổi sau khi đã tạo credential) ---
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Thiếu N8N_ENCRYPTION_KEY - sinh bằng openssl rand -hex 32}"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # --- Timezone ---
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh

      # --- URL / mạng ---
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"          # chỉ vì chạy http local

      # --- Task runners (Code node chạy trong runner riêng) ---
      N8N_RUNNERS_ENABLED: "true"

      # --- AI Agent: cho phép community node dùng làm Tool ---
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"

      # --- Public API (để n8n-mcp quản lý workflow bằng API key) ---
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "false"   # Swagger: http://localhost:5678/api/v1/docs

      # --- Telemetry ---
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

      # --- Dọn dữ liệu execution cũ (168h = 7 ngày) ---
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168

      # --- File access: chỉ cho đọc/ghi trong /files (= ./local-files) ---
      N8N_RESTRICT_FILE_ACCESS_TO: /files

      # --- Binary data (ảnh poster...) lưu ra đĩa thay vì RAM ---
      # Thư mục lưu nằm trên ổ D: ./data/n8n-storage (= D:\n8n-local\data\n8n-storage)
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_STORAGE_PATH: /data/n8n-storage

      # --- Log ---
      N8N_LOG_LEVEL: info
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
      - ./data/n8n-storage:/data/n8n-storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

volumes:
  n8n_data:
  postgres_data:
  qdrant_data:
  ollama_data:
